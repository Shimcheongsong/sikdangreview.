<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>리뷰 데스크</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
/* Layout: summary band on top (score, distribution, to-do count), filter bar, then a single review column with inline reply editor. */
:root{
  color-scheme:light;
  --bg:#eef1f4; --surface:#ffffff; --fg:#1b2430; --muted:#5d6978; --line:#d9dfe6;
  --accent:#1f5f8b; --accent-fg:#ffffff; --accent-soft:#e1edf5;
  --star:#d98a00; --good:#2f7d4f; --warn:#b4541a; --bad:#b3303a;
  --font-body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-display:'Noto Serif KR','Batang',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171d; --surface:#1b222b; --fg:#e6ebf1; --muted:#98a4b3; --line:#2c3642;
  --accent:#6fb0dd; --accent-fg:#0f1a24; --accent-soft:#22364a;
  --star:#f0b43c; --good:#5cc58a; --warn:#f0925a; --bad:#f07882; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --surface:#1b222b; --fg:#e6ebf1; --muted:#98a4b3; --line:#2c3642;
  --accent:#6fb0dd; --accent-fg:#0f1a24; --accent-soft:#22364a;
  --star:#f0b43c; --good:#5cc58a; --warn:#f0925a; --bad:#f07882; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;
  padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2{margin:0;text-wrap:balance}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
#shopName{font-family:var(--font-display);font-size:28px;font-weight:700;background:transparent;border:0;border-bottom:1px dashed var(--line);color:var(--fg);padding:2px 0;width:100%;max-width:420px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:6px;padding:8px 14px;font-weight:500}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:hover{filter:brightness(1.08)}
.summary{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.summary>div{padding:18px 20px;min-width:0}
.summary>div+div{border-left:1px solid var(--line)}
.big{font-family:var(--font-display);font-size:44px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums}
.label{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500}
.stars{color:var(--star);letter-spacing:1px;white-space:nowrap}
.dist{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.dist button{display:grid;grid-template-columns:28px 1fr 28px;gap:8px;align-items:center;background:none;border:0;padding:0;text-align:left;font-size:13px;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--star)}
.dist button[aria-pressed="true"]{font-weight:700}
.todo{display:flex;flex-direction:column;gap:6px}
.todo .big.alert{color:var(--warn)}
.bar-filter{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar-filter input,.bar-filter select,.field input,.field select,.field textarea,.reply-edit textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
.bar-filter input{flex:1 1 180px}
.tabs{display:flex;gap:4px}
.tabs button{background:var(--surface);border:1px solid var(--line);padding:6px 12px;border-radius:6px;font-size:14px}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.card.pending{border-left:4px solid var(--warn)}
.top{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.top .who{font-weight:700}
.chip{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.chip.plat{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.st{font-weight:700}
.chip.st.wait{color:var(--warn);border-color:var(--warn)}
.chip.st.done{color:var(--good);border-color:var(--good)}
.spacer{flex:1}
.date{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.text{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.menu{font-size:13px;color:var(--muted)}
.reply{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:14px}
.reply b{font-size:12px;color:var(--accent);letter-spacing:.04em}
.reply p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.reply-edit{display:flex;flex-direction:column;gap:8px}
.reply-edit textarea{width:100%;min-height:90px;resize:vertical}
.tpl{display:flex;flex-wrap:wrap;gap:6px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);padding:20px;width:min(480px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:13px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.starpick{display:flex;gap:4px}
.starpick button{background:none;border:0;font-size:26px;color:var(--line);padding:0 2px;line-height:1}
.starpick button.on{color:var(--star)}
.empty{text-align:center;color:var(--muted);padding:40px 16px;background:var(--surface);border:1px dashed var(--line);border-radius:10px}
.note{font-size:12px;color:var(--muted)}
@media (max-width:640px){
  .summary{grid-template-columns:1fr}
  .summary>div+div{border-left:0;border-top:1px solid var(--line)}
  #shopName{font-size:23px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div style="flex:1 1 280px;min-width:0">
      <div class="eyebrow">리뷰 데스크</div>
      <input id="shopName" aria-label="식당 이름" value="우리 식당" maxlength="30">
    </div>
    <button class="btn" id="addBtn">+ 리뷰 등록</button>
  </header>

  <section class="summary" aria-label="요약">
    <div>
      <div class="label">평균 별점</div>
      <div class="big" id="avg">-</div>
      <div class="stars" id="avgStars"></div>
      <div class="note" id="total"></div>
    </div>
    <div>
      <div class="label">별점 분포 (누르면 필터)</div>
      <div class="dist" id="dist"></div>
    </div>
    <div class="todo">
      <div class="label">답글 대기</div>
      <div class="big" id="pendingNum">0</div>
      <div class="note" id="rate"></div>
      <div class="note" id="lowNote"></div>
    </div>
  </section>

  <div class="bar-filter">
    <div class="tabs" role="group" aria-label="답글 상태">
      <button data-st="all" aria-pressed="true">전체</button>
      <button data-st="wait" aria-pressed="false">미답변</button>
      <button data-st="done" aria-pressed="false">답변완료</button>
    </div>
    <select id="plat" aria-label="플랫폼"><option value="">모든 플랫폼</option></select>
    <select id="sort" aria-label="정렬">
      <option value="new">최신순</option><option value="old">오래된순</option>
      <option value="low">별점 낮은순</option><option value="high">별점 높은순</option>
    </select>
    <input id="q" type="search" placeholder="작성자, 내용, 메뉴 검색" aria-label="검색">
  </div>

  <div class="list" id="list"></div>
  <p class="note">처음 보이는 리뷰 8건은 예시입니다. 삭제하고 실제 리뷰를 등록해 쓰세요. 데이터는 이 브라우저에만 저장됩니다.</p>
</div>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 style="font-family:var(--font-display);font-size:20px;margin-bottom:14px">리뷰 등록</h2>
    <div class="row2">
      <div class="field"><label for="fPlat">플랫폼</label><select id="fPlat"></select></div>
      <div class="field"><label for="fDate">작성일</label><input id="fDate" type="date" required></div>
    </div>
    <div class="row2">
      <div class="field"><label for="fAuthor">작성자</label><input id="fAuthor" required maxlength="20"></div>
      <div class="field"><label for="fMenu">주문 메뉴</label><input id="fMenu" maxlength="40"></div>
    </div>
    <div class="field"><label>별점</label><div class="starpick" id="starpick"></div></div>
    <div class="field"><label for="fText">리뷰 내용</label><textarea id="fText" rows="4" required></textarea></div>
    <div class="actions" style="justify-content:flex-end">
      <button type="button" class="btn ghost" id="cancel">취소</button>
      <button type="submit" class="btn">등록</button>
    </div>
  </form>
</dialog>

<script>
const PLATS=['네이버','카카오맵','구글','배달의민족','쿠팡이츠'];
const TPL=[
 ['감사','방문해 주시고 좋은 리뷰까지 남겨주셔서 감사합니다. 정성을 다해 준비한 보람을 느낍니다. 또 찾아주세요!'],
 ['사과','불편을 드려 죄송합니다. 말씀해주신 부분은 바로 점검하고 개선하겠습니다. 다음에는 더 나은 모습으로 맞이하겠습니다.'],
 ['재방문','소중한 의견 감사합니다. 다음 방문 때는 더 만족하실 수 있도록 준비하겠습니다.']
];
const today=new Date();
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const ago=n=>iso(new Date(today.getFullYear(),today.getMonth(),today.getDate()-n));
const SEED=[
 {platform:'네이버',author:'맛집탐험가',rating:5,date:ago(1),menu:'된장찌개 정식',text:'반찬이 하나하나 정갈하고 된장찌개가 깊은 맛이에요. 점심시간인데도 서비스가 빨랐습니다.',reply:'',repliedAt:''},
 {platform:'배달의민족',author:'야식러버',rating:2,date:ago(2),menu:'제육볶음',text:'배달이 1시간 넘게 걸렸고 도착했을 때 다 식어 있었어요. 맛은 괜찮았는데 아쉽네요.',reply:'',repliedAt:''},
 {platform:'구글',author:'Daniel K.',rating:4,date:ago(4),menu:'불고기 덮밥',text:'Great flavor and friendly staff. Parking is a bit tight on weekends.',reply:'방문해 주셔서 감사합니다. 주말 주차 안내를 더 신경 쓰겠습니다.',repliedAt:ago(3)},
 {platform:'카카오맵',author:'서연맘',rating:5,date:ago(6),menu:'가족 세트',text:'아이들과 갔는데 아기 의자도 있고 직원분들이 친절하셨어요. 다음 모임도 여기로 정했습니다!',reply:'',repliedAt:''},
 {platform:'쿠팡이츠',author:'혼밥러',rating:1,date:ago(8),menu:'김치찌개',text:'국물이 너무 짜서 먹기 힘들었습니다. 포장도 새서 가방이 다 젖었어요.',reply:'',repliedAt:''},
 {platform:'네이버',author:'맛있는하루',rating:3,date:ago(11),menu:'비빔밥',text:'맛은 평범해요. 가격 대비 양이 조금 적게 느껴졌습니다.',reply:'소중한 의견 감사합니다. 양과 구성을 다시 살펴보겠습니다.',repliedAt:ago(10)},
 {platform:'구글',author:'박지훈',rating:5,date:ago(15),menu:'갈비탕',text:'국물이 진하고 고기가 푸짐합니다. 부모님 모시고 가기 좋아요.',reply:'부모님과 함께 오셨다니 더욱 감사합니다. 또 모시겠습니다!',repliedAt:ago(14)},
 {platform:'카카오맵',author:'점심메이트',rating:4,date:ago(20),menu:'순두부찌개',text:'회사 근처에서 자주 오는데 늘 한결같아요. 점심 피크에는 대기가 좀 있습니다.',reply:'',repliedAt:''}
].map((r,i)=>({id:'s'+i,...r}));

const KEY='review-desk-v1';
let S;
try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}
if(!S||!Array.isArray(S.reviews))S={shop:'우리 식당',reviews:SEED};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let F={st:'all',plat:'',rating:0,sort:'new',q:''};
let editing=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);

$('shopName').value=S.shop;
$('shopName').addEventListener('input',e=>{S.shop=e.target.value;save()});
[$('plat'),$('fPlat')].forEach((el,i)=>PLATS.forEach(p=>el.insertAdjacentHTML('beforeend',`<option>${p}</option>`)));

function summary(){
  const rs=S.reviews,n=rs.length;
  const avg=n?rs.reduce((a,r)=>a+r.rating,0)/n:0;
  $('avg').textContent=n?avg.toFixed(1):'-';
  $('avgStars').textContent=n?stars(Math.round(avg)):'';
  $('total').textContent=`리뷰 ${n}건`;
  const cnt=[0,0,0,0,0,0];rs.forEach(r=>cnt[r.rating]++);
  const max=Math.max(1,...cnt);
  $('dist').innerHTML=[5,4,3,2,1].map(k=>`<button data-r="${k}" aria-pressed="${F.rating===k}" aria-label="${k}점 ${cnt[k]}건"><span>${k}점</span><span class="bar"><i style="width:${cnt[k]/max*100}%"></i></span><span>${cnt[k]}</span></button>`).join('');
  const wait=rs.filter(r=>!r.reply).length;
  $('pendingNum').textContent=wait;
  $('pendingNum').classList.toggle('alert',wait>0);
  $('rate').textContent=n?`답글률 ${Math.round((n-wait)/n*100)}%`:'';
  const low=rs.filter(r=>!r.reply&&r.rating<=2).length;
  $('lowNote').textContent=low?`낮은 별점 ${low}건을 먼저 답해보세요`:'';
}

function render(){
  summary();
  let rs=S.reviews.filter(r=>
    (F.st==='all'||(F.st==='wait')===!r.reply)&&
    (!F.plat||r.platform===F.plat)&&(!F.rating||r.rating===F.rating)&&
    (!F.q||(r.author+r.text+(r.menu||'')).toLowerCase().includes(F.q.toLowerCase())));
  const by={new:(a,b)=>b.date.localeCompare(a.date),old:(a,b)=>a.date.localeCompare(b.date),
    low:(a,b)=>a.rating-b.rating||b.date.localeCompare(a.date),high:(a,b)=>b.rating-a.rating||b.date.localeCompare(a.date)};
  rs.sort(by[F.sort]);
  if(!rs.length){
    $('list').innerHTML=`<div class="empty">${S.reviews.length?'조건에 맞는 리뷰가 없습니다. 필터를 바꿔보세요.':'아직 등록된 리뷰가 없습니다. 오른쪽 위의 “리뷰 등록”으로 첫 리뷰를 추가하세요.'}</div>`;
    return;
  }
  $('list').innerHTML=rs.map(r=>{
    const isEdit=editing===r.id;
    return `<article class="card ${r.reply?'':'pending'}" data-id="${r.id}">
      <div class="top">
        <span class="chip plat">${esc(r.platform)}</span>
        <span class="who">${esc(r.author)}</span>
        <span class="stars" aria-label="별점 ${r.rating}점">${stars(r.rating)}</span>
        <span class="spacer"></span>
        <span class="date">${esc(r.date)}</span>
        <span class="chip st ${r.reply?'done':'wait'}">${r.reply?'답변완료':'미답변'}</span>
      </div>
      ${r.menu?`<div class="menu">주문: ${esc(r.menu)}</div>`:''}
      <p class="text">${esc(r.text)}</p>
      ${r.reply&&!isEdit?`<div class="reply"><b>사장님 답글 · ${esc(r.repliedAt)}</b><p>${esc(r.reply)}</p></div>`:''}
      ${isEdit?`<div class="reply-edit">
        <div class="tpl">${TPL.map((t,i)=>`<button class="btn ghost sm" data-act="tpl" data-i="${i}">${t[0]} 템플릿</button>`).join('')}</div>
        <textarea id="ta-${r.id}" aria-label="답글 내용" placeholder="답글을 입력하세요">${esc(r.reply)}</textarea>
        <div class="actions"><button class="btn sm" data-act="save">저장</button><button class="btn ghost sm" data-act="cancel">취소</button></div>
      </div>`:`<div class="actions">
        <button class="btn sm" data-act="edit">${r.reply?'답글 수정':'답글 작성'}</button>
        <button class="btn ghost sm" data-act="del">삭제</button>
      </div>`}
    </article>`}).join('');
  if(editing){const ta=$('ta-'+editing);if(ta&&document.activeElement!==ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length)}}
}

$('list').addEventListener('click',e=>{
  const b=e.target.closest('button[data-act]');if(!b)return;
  const card=b.closest('.card'),id=card.dataset.id,r=S.reviews.find(x=>x.id===id);
  const act=b.dataset.act;
  if(act==='edit'){editing=id;render()}
  else if(act==='cancel'){editing=null;render()}
  else if(act==='tpl'){const ta=$('ta-'+id);ta.value=TPL[b.dataset.i][1];ta.focus()}
  else if(act==='save'){
    const v=$('ta-'+id).value.trim();
    r.reply=v;r.repliedAt=v?iso(new Date()):'';editing=null;save();render();
  }else if(act==='del'){
    if(b.dataset.armed){S.reviews=S.reviews.filter(x=>x.id!==id);save();render()}
    else{b.dataset.armed='1';b.textContent='정말 삭제';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='삭제'}},3000)}
  }
});

document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{
  F.st=b.dataset.st;document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()}));
$('plat').addEventListener('change',e=>{F.plat=e.target.value;render()});
$('sort').addEventListener('change',e=>{F.sort=e.target.value;render()});
$('q').addEventListener('input',e=>{F.q=e.target.value.trim();render()});
$('dist').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  const r=+b.dataset.r;F.rating=F.rating===r?0:r;render()});

let rating=5;
function paintStars(){$('starpick').innerHTML=[1,2,3,4,5].map(k=>`<button type="button" data-k="${k}" class="${k<=rating?'on':''}" aria-label="${k}점">★</button>`).join('')}
$('starpick').addEventListener('click',e=>{const b=e.target.closest('button');if(b){rating=+b.dataset.k;paintStars()}});
$('addBtn').addEventListener('click',()=>{
  $('form').reset();$('fDate').value=iso(new Date());rating=5;paintStars();$('dlg').showModal()});
$('cancel').addEventListener('click',()=>$('dlg').close());
$('form').addEventListener('submit',e=>{
  e.preventDefault();
